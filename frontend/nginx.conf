server {
    # $PORT is substituted at container startup by envsubst (see Dockerfile CMD).
    # Falls back to 80 when running locally without Railway's PORT injection.
    listen ${PORT};
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback — all routes served by index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
